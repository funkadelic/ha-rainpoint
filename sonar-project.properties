# SonarQube project configuration for RainPoint Cloud Integration

# Project identification
sonar.projectKey=funkadelic_ha-rainpoint
sonar.organization=funkadelic

# Project metadata
sonar.projectName=RainPoint Cloud Integration
sonar.projectVersion=1.19.1 # x-release-please-version

# Source code location
sonar.sources=custom_components/rainpoint
sonar.tests=tests
sonar.test.inclusions=tests/**/*

# Exclude binary brand assets; Sonar cannot parse images as UTF-8 source
sonar.exclusions=custom_components/rainpoint/brand/**

# Exclude test files from duplication detection
sonar.cpd.exclusions=tests/**/*

# Keep coverage exclusions in step with [tool.coverage.run] omit in pyproject.toml.
# debug.py is dead in shipped builds (DEBUG_WORKER_URL is "" in const.py, and
# switch.py registers the debug switch only when it is truthy), so pytest omits
# it and coverage.xml carries no data for it at all. Without this line Sonar
# reads that absence as uncovered rather than excluded, and any edit to the
# module drives new-code coverage below the gate for a file nothing imports.
sonar.coverage.exclusions=custom_components/rainpoint/debug.py

# Python version for analysis
# pytest-homeassistant-custom-component 0.13.310+ requires Python 3.13+
sonar.python.version=3.13

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Suppress false positives from Home Assistant platform contracts
# HA requires async_setup, async_setup_entry, async_unload_entry, etc. to be
# async even when they do not await, and dictates their parameter signatures.
sonar.issue.ignore.multicriteria=e1,e2,e3

# S7503: async functions that do not use async features.
# HA contract: async_setup_* must be async whether or not they await.
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e1.resourceKey=custom_components/rainpoint/**/*.py

# S1172: unused function parameters.
# HA contract: async_setup(hass, config), async_setup_entry(hass, entry),
# async_unload_entry(hass, entry) signatures are dictated by the platform.
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.e2.resourceKey=custom_components/rainpoint/__init__.py

# S1172: unused function parameters.
# HA contract: the repairs platform hook async_create_fix_flow(hass, issue_id,
# data) is called positionally by RepairsFlowManager, so all three parameters
# must exist in that order whether or not the integration reads them. Both
# unused ones are unused deliberately: the flow manager assigns flow.hass
# itself right after constructing the flow, and the flow is built from data
# rather than issue_id so the issue id stays opaque, which is what stops a
# later change to its prefix resolving to the wrong device.
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.e3.resourceKey=custom_components/rainpoint/repairs.py
