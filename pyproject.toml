[tool.coverage.run]
omit = ["custom_components/rainpoint/debug.py"]

[tool.coverage.report]
fail_under = 99

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "--cov=custom_components.rainpoint",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.ruff]
target-version = "py313"
line-length = 130

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.rainpoint"]

# Editor-only. No CI job runs a type checker, and ruff remains the enforced
# linter. This exists so an editor's Pyright reports real source rather than
# the test suite: the tests deliberately pass SimpleNamespace and MagicMock
# fakes where Home Assistant types are annotated, and conftest.py stubs whole
# modules by assigning attributes onto them. Both are documented patterns, not
# defects, and they account for the large majority of the findings. Including
# tests here would bury the source findings under them.
#
# scripts/ is real maintainer source rather than a test fake, so it is in
# scope for the same reason custom_components is, and its presence here keeps
# this block consistent with the maintainer's own pyrightconfig.json.
[tool.pyright]
include = ["custom_components", "scripts"]
exclude = ["**/__pycache__"]
