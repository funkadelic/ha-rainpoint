name: Tests
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # uv resolves and unpacks this dependency tree in a fraction of pip's time
      # (measured locally: 8s against pip's 58s, both with a cold cache), which is
      # where the install cost actually sits. Caching is left off deliberately:
      # restoring a cache costs more wall clock than an install this fast saves.
      # Pinned to an exact patch: astral-sh stopped publishing moving major tags
      # after v7, so "@v8" does not resolve.
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system -r requirements-test.txt

      - name: Run tests with pytest
        run: |
          pytest --cov-report=xml --junitxml=junit.xml --tb=short

      - name: Upload coverage to Codecov
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: >-
          !cancelled()
          && !contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      # A scan costs ~50s, of which only ~16s is analysis; the rest is scanner
      # provisioning and server round trips. Skip it entirely when the pull
      # request touches nothing Sonar reads. Pushes to main always analyze so
      # the new-code baseline stays current.
      - name: Check whether Sonar analysis is needed
        id: sonar
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
          && github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request; analyzing to keep the main baseline current."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit $BASE_SHA unavailable; analyzing rather than guessing."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${BASE_SHA}...HEAD")
          if printf '%s\n' "$changed" \
            | grep -qE '^(custom_components/rainpoint/|tests/|sonar-project\.properties$|pyproject\.toml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No analyzed sources changed; skipping Sonar."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube Scan
        if: steps.sonar.outputs.run == 'true'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
