name: Tests
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # uv resolves and unpacks this dependency tree in a fraction of pip's time,
      # which is where the install cost actually sits. Caching is left off
      # deliberately: restoring one costs more wall clock than an install this
      # fast can save. Pinned to an exact patch because astral-sh stopped
      # publishing moving major tags after v7, so "@v8" does not resolve.
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system -r requirements-test.txt

      - name: Run tests with pytest
        run: |
          pytest --cov-report=xml --junitxml=junit.xml --tb=short

      - name: Upload coverage to Codecov
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: >-
          !cancelled()
          && !contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
        uses: codecov/codecov-action@v7
        with:
          files: ./junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: SonarQube Scan
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
          && github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
