name: Tests
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Two jobs rather than one matrix, because "test" is a required status check
  # on main: a matrix would rename it to "test (3.14)" and the required check
  # would never report again, blocking every pull request. This job stays the
  # newest supported combination and keeps the reporting steps; test-min below
  # covers the oldest.
  #
  # An integration runs on whatever Python Home Assistant ships, so the version
  # here is dictated by HA, not chosen. HA has required 3.14 since 2026.3, which
  # is what about 80% of installs run.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # uv resolves and unpacks this dependency tree in a fraction of pip's time
      # (measured locally: 8s against pip's 58s, both with a cold cache), which is
      # where the install cost actually sits. Caching is left off deliberately:
      # restoring a cache costs more wall clock than an install this fast saves.
      # Pinned to an exact patch: astral-sh stopped publishing moving major tags
      # after v7, so "@v8" does not resolve.
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system -r requirements-test.txt

      - name: Run tests with pytest
        run: |
          pytest --cov-report=xml --junitxml=junit.xml --tb=short

      - name: Upload coverage to Codecov
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: >-
          !cancelled()
          && !contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      # The test-count badge in README.md reads its number from a gist rather
      # than from the repository, so publishing a new count costs no commit and
      # no push to main. Only pushes to main update it, so an open pull request
      # never moves the published figure. GIST_TOKEN is a personal access token
      # with the gist scope; the default GITHUB_TOKEN cannot write gists.
      - name: Count tests
        id: test-count
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -z "$GIST_TOKEN" ]; then
            echo "GIST_TOKEN is not set; leaving the badge at its last value."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET

          suites = ET.parse("junit.xml").getroot().iter("testsuite")
          print(f"count={sum(int(s.get('tests', 0)) for s in suites)}")
          PY

      - name: Publish the test-count badge
        if: steps.test-count.outputs.publish == 'true'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: e814bc9b80ce48781f29b860011051d9
          filename: ha-rainpoint-tests.json
          label: tests
          message: ${{ steps.test-count.outputs.count }}
          color: blue

      # A scan costs ~50s, of which only ~16s is analysis; the rest is scanner
      # provisioning and server round trips. Skip it entirely when the pull
      # request touches nothing Sonar reads. Pushes to main always analyze so
      # the new-code baseline stays current.
      - name: Check whether Sonar analysis is needed
        id: sonar
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
          && github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request; analyzing to keep the main baseline current."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit $BASE_SHA unavailable; analyzing rather than guessing."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${BASE_SHA}...HEAD")
          if printf '%s\n' "$changed" \
            | grep -qE '^(custom_components/rainpoint/|tests/|sonar-project\.properties$|pyproject\.toml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No analyzed sources changed; skipping Sonar."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube Scan
        if: steps.sonar.outputs.run == 'true'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The floor declared in hacs.json: Home Assistant 2026.2.0, which runs Python
  # 3.13. Runs the suite only. Coverage, the badge and Sonar all belong to the
  # job above, so they report once rather than racing each other.
  test-min:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system -r requirements-test-min.pip

      # --no-cov because addopts turns coverage on with a fail_under gate. The
      # job above already measures and uploads it, and a product path that only
      # newer Home Assistant can reach would fail this gate here for a reason
      # that has nothing to do with the oldest supported release.
      - name: Run tests with pytest
        run: pytest --no-cov --tb=short
