name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Without these the token inherits every grant the app installation
          # holds. These two are what this workflow actually uses: contents for
          # the version-bump commit, the tag, the release, and the asset
          # upload; pull-requests for the release PR and its labels. Requesting
          # a permission the installation lacks fails the token request, so a
          # release that starts erroring here wants the specific scope added
          # back rather than this block removed.
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.release_created }}
        with:
          persist-credentials: false

      - name: Package integration
        if: ${{ steps.release.outputs.release_created }}
        run: |
          cd custom_components/rainpoint
          zip -r ../../rainpoint.zip .

      - name: Upload release asset
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" rainpoint.zip
