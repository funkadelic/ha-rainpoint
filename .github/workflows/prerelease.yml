name: Pre-release (beta)

# Manually publish a HACS beta build without touching the release-please flow.
#
# It builds the rainpoint.zip asset (exactly like release-please.yml does),
# rewrites the version in the packaged files IN THE RUNNER ONLY (nothing is
# committed or pushed), and creates a GitHub *pre-release*. HACS hides
# pre-releases from everyone except users who enable "Show beta versions" for
# this integration, so stable users get no update notification.
#
# NOTE: workflow_dispatch only lists workflows that exist on the default
# branch, so this file must be merged to main before it can be run. When
# dispatching, pick the FEATURE BRANCH in the "Use workflow from" selector -
# the release is cut from that branch's HEAD, main is never modified, and
# .release-please-manifest.json stays put so the eventual stable release is
# unaffected.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version (e.g. 1.7.0b1). A leading 'v' is stripped for files; the tag is v<version>."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run against a tag, SHA, or the default branch
        if: ${{ github.ref_type != 'branch' || github.ref == 'refs/heads/main' }}
        run: |
          echo "::error::Pre-releases must be cut from a non-main feature branch. Re-run and pick the branch in 'Use workflow from'."
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve version and tag
        id: ver
        env:
          RAW: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          # Reject control characters (e.g. newlines) up front so a crafted input
          # cannot inject extra keys into $GITHUB_OUTPUT further down.
          if [[ "$RAW" == *$'\n'* || "$RAW" == *$'\r'* ]]; then
            echo "::error::Version must be a single line with no control characters."
            exit 1
          fi
          VERSION="${RAW#v}"           # strip any leading 'v' for the file version
          # Require a pre-release suffix (a, b, rc, alpha, beta, dev): a bare stable
          # version like 1.7.0 must not be published here, since that tag would later
          # collide with the stable tag release-please creates for the same version.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+[.-]?(a|b|rc|alpha|beta|dev)\.?[0-9]+$'; then
            echo "::error::Invalid version '$VERSION'. A pre-release suffix is required, e.g. 1.7.0b1, 1.7.0-beta.1, 1.7.0rc1."
            exit 1
          fi
          TAG="v$VERSION"
          # git ls-remote --exit-code: 0 = tag exists, 2 = tag absent, other = query failure.
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::Tag $TAG already exists"
            exit 1
          elif [ "$rc" -ne 2 ]; then
            echo "::error::Could not query remote tags (git ls-remote exit $rc)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building $TAG from $REF_NAME @ ${GITHUB_SHA::7}"

      - name: Stamp version into packaged files (runner only, not committed)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # manifest.json
          tmp="$(mktemp)"
          jq --arg v "$VERSION" '.version = $v' custom_components/rainpoint/manifest.json > "$tmp"
          mv "$tmp" custom_components/rainpoint/manifest.json
          # const.py (only the release-please-annotated line)
          sed -i -E "s/^(VERSION = \")[^\"]*(\"[[:space:]]*# x-release-please-version)/\1${VERSION}\2/" custom_components/rainpoint/const.py
          # Fail loudly if either stamp did not take
          grep -q "\"version\": \"${VERSION}\"" custom_components/rainpoint/manifest.json
          grep -q "^VERSION = \"${VERSION}\"" custom_components/rainpoint/const.py
          echo "Stamped version ${VERSION}"

      - name: Package integration
        run: |
          cd custom_components/rainpoint
          zip -r ../../rainpoint.zip .

      - name: Create pre-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # gh release create makes the release + tag, then uploads the asset. If it
          # fails partway, delete both so a rerun is not blocked by the tag guard.
          cleanup() {
            echo "::warning::Pre-release creation failed; removing $TAG so a rerun starts clean."
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          }
          trap cleanup ERR
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "$TAG (beta)" \
            --notes "Beta test build from \`$REF_NAME\`. Not a production release.

          Enable it in HACS via the integration's ⋮ menu -> Redownload -> \"Show beta versions\", then pick this version. Stable users are not notified." \
            rainpoint.zip
          trap - ERR
