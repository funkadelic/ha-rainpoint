name: Validate with hassfest
permissions:
  contents: read

on:
  # main only: a branch push is already covered by its pull_request run.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

# Cancel a superseded pull request run. Every other run gets its own group,
# since a pending run in a shared group is replaced by the next one queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to a commit rather than @master so a repointed branch cannot
      # change what runs here. Upstream's only tag is 1.0.0 from 2020, 157
      # commits behind master, so there is no usable release to track and
      # Dependabot cannot bump this. Refresh it by hand periodically: hassfest
      # validates against Home Assistant's current requirements, so a stale pin
      # stops catching new ones.
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master as of 2026-07-21
