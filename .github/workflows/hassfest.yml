name: Validate with hassfest
permissions:
  contents: read

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      # Pinned to a commit rather than @master so a repointed branch cannot
      # change what runs here. Upstream's only tag is 1.0.0 from 2020, 157
      # commits behind master, so there is no usable release to track and
      # Dependabot cannot bump this. Refresh it by hand periodically: hassfest
      # validates against Home Assistant's current requirements, so a stale pin
      # stops catching new ones.
      - uses: home-assistant/actions/hassfest@e3fb68ebda13d88a0d695082f471ba2c83d025fb # master as of 2026-07-21
