name: New device support request
description: Request support for a RainPoint device that reports as "unsupported"
title: "Add support for "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping add a new device! To write a correct decoder we need the
        device's **raw payload** in one or more **known states**. A single payload
        shows the byte layout but not what each byte means; captures in different
        states (valve closed vs open, a sensor at a known reading) are what let us
        map bytes to values.

        **The easiest way to send us a payload is a diagnostics file.** Go to
        **Settings → Devices & Services → RainPoint**, open the three-dot menu on the
        device and choose **Download diagnostics**. That file carries the raw payload,
        what the integration made of it, and the model and firmware details, with your
        password, tokens, email and network addresses already removed. Nothing to
        enable and nothing to copy by hand. Device and home names are kept in the file
        so we can tell which device is which, so read it before attaching if that
        matters to you.

        For a second and third capture in different states, take one diagnostics file
        per state. If you would rather not attach files, `DEBUG_VALVE_PAYLOAD.md` has
        the manual route: enable the per-device **"Raw Payload"** diagnostic sensor
        (disabled by default), then read its value from the entity's attributes or the
        logs.

        **Device returning no readings at all?** If you got here from a **"Not Reporting"**
        entity, there is no payload to capture and the payload field below is already
        filled in for you saying so. That is the finding, so please still file this:
        tell us what the RainPoint app shows for the device and how it is paired.
  - type: input
    id: model
    attributes:
      label: Model number
      description: The exact model as printed on the device or shown in the RainPoint app (e.g. HTV145FRF, HIC801W).
      placeholder: HTV145FRF
    validations:
      required: true
  - type: input
    id: model_code
    attributes:
      label: Model code
      description: >
        Pre-filled automatically when you open this form from the integration's
        "Report this device" link. One model number can cover more than one hardware
        variant, and the variants can differ in how many zones they report, so this
        is what tells us exactly which one you have. If it is blank, the integration
        did not report one; leave it empty rather than guessing.
      placeholder: "303"
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: Device category
      options:
        - Valve / irrigation timer (single zone)
        - Valve hub / controller (multiple zones)
        - Soil sensor
        - Rain sensor
        - Temperature / humidity sensor
        - Weather station / display hub
        - Pool sensor
        - Other / not sure
    validations:
      required: true
  - type: input
    id: zones
    attributes:
      label: Number of zones / stations
      description: For valves and controllers only. How many independent outlets does the device control?
      placeholder: "1"
    validations:
      required: false
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: Shown in the RainPoint app under device details, if available.
    validations:
      required: false
  - type: textarea
    id: primary_payload
    attributes:
      label: Raw payload (idle / resting state)
      description: >
        Paste the raw payload from the "Raw Payload" diagnostic sensor with the device
        idle - valve closed, or the sensor sitting at a normal reading. Include the
        `10#` or `11#` prefix exactly as shown. If this arrived pre-filled saying the
        device returns no status, leave it exactly as it is.
      placeholder: "10#E1BC00DC01D80020B700000000AD00009F95110000FF0F5D81D019"
      render: text
    validations:
      required: true
  - type: textarea
    id: auto_decoded
    attributes:
      label: Auto-detected fields (unverified)
      description: >
        Pre-filled automatically from the payload above when you open this form from
        the integration's "Report this device" link. These are the raw field names
        and values a model-agnostic decode found, with any "[zone N]" labels coming
        from the bundled product catalog - a starting point for triage only. They are
        NOT verified and their scaling/units are unknown, so leave them as they are;
        the app readings you enter below are what we actually rely on.
      render: text
    validations:
      required: false
  - type: textarea
    id: gate_diagnostics
    attributes:
      label: What the integration already knows about this model
      description: >
        Pre-filled automatically from the bundled product catalog when you open this
        form from the integration's "Report this device" link. It lists which of the
        device's readings already have a verified definition and which do not, so we
        can see what is actually missing without re-deriving it. Leave it as it is.
      render: text
    validations:
      required: false
  - type: textarea
    id: diagnostics_file
    attributes:
      label: Diagnostics file (the most useful thing you can attach)
      description: >
        Drag the JSON file from **Download diagnostics** into this box and GitHub will
        attach it. Settings → Devices & Services → RainPoint, three-dot menu on the
        device, Download diagnostics. One file per state if you can manage more than
        one, and say which state each was taken in.

        This is worth more than everything above put together: it carries the payload
        in the exact form the code sees it, alongside what the integration decoded,
        so there are no transcription errors and no follow-up questions. Credentials,
        tokens, your email and network addresses are already removed. Device and home
        names are kept, so read the file first if that matters to you.
    validations:
      required: false
  - type: textarea
    id: debug_log
    attributes:
      label: Debug log excerpt (only worth doing if you did not attach a diagnostics file)
      description: >
        The manual alternative to the diagnostics file above. Enable debug logging for
        the integration, then copy the `unsupported model` warning plus a few
        surrounding lines. The log carries the model, product key, raw payload, and
        internal ids in the exact form the code sees - no transcription errors on the
        long hex string.

        Before posting: this is a public issue, so remove account and device
        identifiers, tokens, credentials, and any unrelated personal data. Keep the
        model, payload, and surrounding lines that describe the unsupported device.
      render: text
    validations:
      required: false
  - type: textarea
    id: state_payloads
    attributes:
      label: Additional payloads in known states
      description: >
        This is the most useful part. Capture the payload again after changing the
        device to a known state, and label each one with what the device was doing.

        The bundled product catalog usually already tells us which reading belongs to
        which zone, and the auto-detected fields above show that as "[zone N]". What
        it does NOT tell us is the scale: whether a raw 725 means 72.5 or 725, and in
        which unit. That is what these captures settle, and it is why we cannot ship
        support from the catalog alone.

        For multi-zone valves/controllers, still capture one zone at a time: open ONLY
        zone 1 and capture, then close it and open ONLY zone 2, and so on. That both
        confirms the catalog's zone mapping is right for your hardware and shows which
        bytes move when only one zone changes.

        For sensors, note the app-shown value at capture time. One payload per line,
        each with a short label.
      placeholder: |
        only zone 1 open, 5 min set: 10#....
        only zone 2 open, 5 min set: 10#....
        all zones closed:            10#....
        app shows 42% moisture, 21.5 C: 10#....
      render: text
    validations:
      required: false
  - type: textarea
    id: app_values
    attributes:
      label: Current readings shown in the RainPoint app (include units)
      description: >
        What does the official app show for this device right now? List each reading
        WITH its unit, because the decoders scale raw values (e.g. temperature is
        stored x10) and a number without a unit cannot confirm the scaling. Include
        battery %, signal, zone open/closed, and remaining run time where relevant.
      placeholder: |
        temperature: 21.5 C  (not F)
        moisture: 42 %
        battery: 80 %
        zone 1: closed
    validations:
      required: false
  - type: input
    id: region
    attributes:
      label: Region / country
      description: Helps confirm which cloud region and hub the device is paired to.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I attached a diagnostics file, or captured the payload(s) above from the disabled-by-default "Raw Payload" diagnostic sensor, or this device returns no status and I described what the RainPoint app shows.
          required: true
        - label: I searched existing issues and this model is not already requested or supported.
          required: true
        - label: I understand the maintainer only owns some of these devices, so support may require follow-up captures from me to get the decoding right.
          required: true
  - type: checkboxes
    id: can_test
    attributes:
      label: Testing help
      description: The maintainer likely does not own this device, so iterating on the decoder depends on you.
      options:
        - label: I can install a patched/pre-release build and send additional captures to help verify the decoding.
          required: false
