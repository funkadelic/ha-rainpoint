# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Monitor GitHub Actions if you add workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Monitor Python (pip) dependencies
  - package-ecosystem: "pip"
    directory: "/"
    # requirements-test-min.txt pins the oldest supported Home Assistant on
    # purpose. Dependabot's ignore rules cannot be scoped to one file, so
    # without this it bumps that pin to match requirements-test.txt and the
    # oldest supported release stops being tested.
    exclude-paths:
      - "requirements-test-min.txt"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "python"
